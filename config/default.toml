[server]
host = '127.0.0.1'
port = 17420
data_dir = 'data'
db_path = 'data/leadfinder.db'
log_dir = 'logs'
cache_dir = 'cache'
prompts_dir = 'prompts'
assets_dir = 'assets'
tools_dir = 'tools'
models_dir = 'models'

[discovery]
region = 'BG'
languages = ['bg', 'en', 'ru', 'tr']
requests_per_minute = 12
breaker_failures = 5
breaker_cooldown_minutes = 30
cache_ttl_hours = 6
automated_discovery_enabled = false
yt_dlp_timeout_seconds = 45

[extraction]
ffmpeg_timeout_seconds = 120
whisper_timeout_seconds = 300
ocr_timeout_seconds = 60
keyframe_interval_seconds = 3
max_keyframes = 20
ocr_languages = ['bul', 'eng']
ocr_dedup_similarity = 0.85

[funnel]
min_views = 500
min_views_per_hour = 50
daily_lead_cap = 100
low_quality_threshold = 0.4
retention_days = 7
daily_llm_budget = 500
daily_search_budget = 1000
cluster_similarity_threshold = 0.55
virality_saturation_views = 1000000
phash_max_hamming = 6
tune_min_decisions = 200
bypass_sources = ['paste', 'partner', 'import']

[ranking]
w_check = 0.35
w_viral = 0.20
w_verdict = 0.35
w_q = 0.15
checkworthy_threshold = 0.45
weight_llm_score = 0.60
weight_contains_numbers = 0.12
weight_public_figure = 0.10
weight_sensitive_topic = 0.10
weight_urges_sharing = 0.08
sensitive_topic_terms = ['здраве', 'ваксин', 'лекарств', 'рак', 'избори', 'гласува', 'бюлетин', 'евро', 'война', 'пенси', 'данък', 'ток', 'вода']
share_urge_terms = ['споделете', 'разпространете', 'предайте', 'преди да го изтрият', 'скриват от нас', 'share']

[claim_quality]
min_words = 5
min_alpha_ratio = 0.75
min_script_share = 0.6
script_ranges = [[1024, 1279]]
min_known_word_share = 0.75
max_foreign_token_share = 0.15
max_short_token_share = 0.45
reject_questions = true
rejected_terms = ['напиши в коментарите', 'сподели', 'споделете', 'абонирай', 'последвай', 'лайкни', '#']
generic_actor_terms = ['някой', 'някои', 'неизвестен', 'неизвестна', 'speaker', 'народът', 'народ', 'хората', 'водещата', 'водещият', 'глас зад кадър', 'участник', 'производител', 'държави', 'медията', 'медиите', 'властите', 'всички', 'те']

[normalisation]
lexicon_config_file = 'lexicon.bg.toml'
wikidata_languages = ['bg', 'en']
definite_suffixes = ['ът', 'ят', 'та', 'то', 'те']
role_prefixes = ['проф.', 'проф', 'доц.', 'доц', 'д-р', 'ген.', 'ген', 'акад.', 'инж.', 'г-н', 'г-жа', 'президентът', 'премиерът', 'министърът', 'депутатът']
surname_suffixes = ['ов', 'ова', 'ев', 'ева', 'ски', 'ска', 'ин', 'ина']

[expansion]
min_flagged_videos = 3
window_days = 30
max_videos_per_creator = 20
max_depth = 2

[capacity]
target_videos_per_day = 300
processing_window_hours = 12
avg_video_seconds = 45
overhead_seconds = 10
max_wer_ceiling = 0.40
min_llm_tokens_per_second = 8.0
min_llm_json_validity = 0.95

[providers]
llm_chain = ['local', 'gemini', 'heuristics']
cloud_enabled = false
local_llm_url = 'http://127.0.0.1:18080'
local_llm_model = 'BgGPT-Gemma-3-4B-IT-Q4_K_M.gguf'
gemini_model = 'gemini-2.5-flash'
transcriber_engine = 'whisper_cpp'
whisper_model = 'small'
ocr_engine = 'tesseract'
searxng_url = ''

[verification]
min_independent_news_outlets = 2
passages_per_claim = 8
retrieval_window_days = 30
already_checked_similarity = 0.60
news_domains = ['bntnews.bg', 'bnr.bg', 'bta.bg', 'btvnovinite.bg', 'nova.bg', 'dnevnik.bg', 'capital.bg', 'mediapool.bg', 'segabg.com', 'offnews.bg', 'dir.bg', 'dariknews.bg', '24chasa.bg', 'trud.bg', 'clubz.bg']

[[factcheck_archives]]
name = 'Factcheck.bg'
base_url = 'https://factcheck.bg'
feed_url = 'https://factcheck.bg/feed/'
sitemap_url = 'https://factcheck.bg/post-sitemap.xml'
search_url_template = 'https://factcheck.bg/?s={query}'
enabled = true

[[factcheck_archives]]
name = 'AFP Провери'
base_url = 'https://proveri.afp.com'
feed_url = 'https://proveri.afp.com/rss.xml'
sitemap_url = 'https://proveri.afp.com/sitemap.xml'
search_url_template = 'https://proveri.afp.com/search?search_api_fulltext={query}'
enabled = false

[[factcheck_archives]]
name = 'BNR Проверено'
base_url = 'https://bnr.bg'
feed_url = 'https://bnr.bg/factcheck/rss'
sitemap_url = 'https://bnr.bg/sitemap.xml'
search_url_template = ''
enabled = true

[[factcheck_archives]]
name = 'BNT Проверено'
base_url = 'https://bntnews.bg'
feed_url = ''
sitemap_url = 'https://bntnews.bg/sitemap.xml'
search_url_template = 'https://bntnews.bg/search?q={query}'
enabled = true

[[factcheck_archives]]
name = 'BROD'
base_url = 'https://brodhub.eu'
feed_url = 'https://brodhub.eu/feed/'
sitemap_url = 'https://brodhub.eu/XWiki/EDMO/Hub/SiteMap?xpage=plain&outputSyntax=plain'
search_url_template = ''
enabled = true
