[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/providers",
    "crates/probe",
    "crates/pipeline",
    "crates/cli",
]
exclude = [
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
encoding_rs = "0.8"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "3.6", features = ["windows-native"] }
quick-xml = "0.37"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "stream", "cookies"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
sysinfo = "0.33"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.12", features = ["v4", "serde"] }
leadfinder-core = { path = "crates/core" }
leadfinder-providers = { path = "crates/providers" }
leadfinder-probe = { path = "crates/probe" }
leadfinder-pipeline = { path = "crates/pipeline" }
